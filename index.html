<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Da Dior</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px 20px;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .hero h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      color: #bbb;
      max-width: 600px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 30px;
      border: 1px solid white;
      border-radius: 30px;
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .button:hover {
      background: white;
      color: black;
    }

    footer {
      padding: 25px;
      color: #777;
      border-top: 1px solid #333;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">DA DIOR 👽</div>
  </header>

  <section class="hero">
    <h1>Welcome to Da Dior</h1>

    <p>
      Fashion. Creativity. Vision.
      <br>
      Welcome to my world.
    </p>

    <a class="button" href="Da_Dior_About_Me.html">
      About Me
    </a>
  </section>

  <footer>
    © 2026 Da Dior. All Rights Reserved.
  </footer>

</body>
</html>
